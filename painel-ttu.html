<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Próximas partidas – Terminal de Transporte Urbano (TTU)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Painel de TV do Terminal (TTU): próximas partidas por linha, com a situação pelo GPS dos ônibus. Feito para 1920×1080 (escala sozinho). */
:root{ --azul:#12325b; --azul2:#0c2340; --laranja:#f07800; --fundo:#0b1622; --linha:#13263a; --linha2:#0f2031; --tx:#f2f6fa; --mu:#9fb2c4; --verde:#2fbf71; --amarelo:#ffd23f; --verm:#ff6b5e;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif; --body:'Barlow','Segoe UI',Arial,sans-serif; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fundo);color:var(--tx);font-family:var(--body);overflow:hidden;cursor:none}
.tela{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;display:grid;grid-template-rows:118px 64px 1fr 70px}
header{display:flex;align-items:center;gap:30px;padding:0 44px;background:#fff;color:var(--azul)}
header img{height:84px;display:block}
header .tt{border-left:5px solid var(--laranja);padding-left:26px}
header h1{margin:0;font-family:var(--display);font-size:54px;line-height:1}
header p{margin:4px 0 0;font-size:24px;color:#566777;font-weight:600}
header .rel{margin-left:auto;text-align:right}
header .hora{font-family:var(--display);font-size:76px;line-height:.9;font-variant-numeric:tabular-nums}
header .data{font-size:22px;color:#566777;font-weight:600}
.cab,.row{display:grid;grid-template-columns:150px 1fr 150px 190px 400px 290px;align-items:center;column-gap:24px;padding:0 44px}
.ponto .cab,.ponto .row{grid-template-columns:150px 1fr 190px 400px 290px}
.cab{background:var(--azul);font-size:24px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#cfe0f1}
.lista{position:relative}
.row{height:var(--h,72px);border-bottom:2px solid #08121c}
.row:nth-child(odd){background:var(--linha)} .row:nth-child(even){background:var(--linha2)}
.num{font-family:var(--display);font-weight:700;font-size:44px;height:58px;border-radius:10px;display:grid;place-items:center;letter-spacing:.5px}
.dest{min-width:0}
.dest b{display:block;font-size:36px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.dest span{display:block;font-size:23px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ala{font-family:var(--display);font-size:40px;font-weight:700;text-align:center;color:#fff}
.ala small{display:block;font-size:18px;font-family:var(--body);color:var(--mu);font-weight:600;line-height:1}
.hr{font-family:var(--display);font-size:56px;font-weight:700;font-variant-numeric:tabular-nums}
.sit{font-size:30px;font-weight:700;display:flex;align-items:center;gap:14px}
.sit i{width:20px;height:20px;border-radius:50%;flex:none;background:var(--mu)}
.sit.term{color:var(--verde)} .sit.term i{background:var(--verde);animation:pisca 1.2s infinite}
.sit.cheg{color:var(--amarelo)} .sit.cheg i{background:var(--amarelo)}
.sit.atr{color:var(--verm)} .sit.atr i{background:var(--verm)}
.sit.saindo{color:#fff} .sit.saindo i{background:var(--laranja);animation:pisca .8s infinite}
.sit.prog{color:var(--mu);font-weight:600}
.sit.off{color:#c9d3dc;font-weight:600} .sit.off i{background:transparent;border:3px solid #7d8b98}
.sit small{display:block;font-size:20px;font-weight:600;color:var(--mu)}
.dep{font-family:var(--display);font-size:34px;color:var(--mu);font-variant-numeric:tabular-nums}
.enc .hr,.enc .dest b{color:var(--mu)}
@keyframes pisca{50%{opacity:.25}}
footer{display:flex;align-items:center;background:var(--azul2);border-top:4px solid var(--laranja);overflow:hidden;font-size:30px;font-weight:600;white-space:nowrap}
footer .rot{flex:none;background:var(--laranja);color:#1a0f00;font-weight:700;height:100%;display:flex;align-items:center;padding:0 26px;text-transform:uppercase;font-size:24px}
footer .corre{flex:1;overflow:hidden;position:relative;height:100%}
footer .corre span{position:absolute;top:50%;transform:translate(0,-50%);white-space:nowrap;padding-left:100%;animation:letreiro var(--t,30s) linear infinite}
@keyframes letreiro{to{transform:translate(-100%,-50%)}}
.pag{position:absolute;right:44px;top:-46px;font-size:22px;color:#cfe0f1;font-weight:700}
.aviso-rt{font-size:20px;color:var(--mu);margin-left:20px}
</style>
</head>

o Dourado, sem INSS e UPA","Praia - PQ DA LAGOA - COL.":"via Pq. da Lagoa, sem INSS e UPA","Praia - PQ DA LAGOA - COLO - OLIVEIRAS - INSS":"via Pq. da Lagoa e Jd. Oliveiras","Praia - JD. ATLANTIS - VIA INSS":"via Jd. Atlantis","Praia - PDO-COL-Oliveiras-UPA-INSS":"via Porto Dourado e Jd. Oliveiras","Praia - COL-PDO-Oliveiras":"via Porto Dourado e Jd. Oliveiras, sem INSS e UPA","Praia - PDO - COL":"via Porto Dourado, sem INSS e UPA","Praia - COL - PDO - JD ATL":"via Porto Dourado e Jd. Atlantis","Praia - INSS-UPA-COL-SATURNINO":"via R. Saturnino","Praia - INSS-UPA-COL-ARAUCARIA":"via Araucária","Praia - INSS-UPA-COL - JD. ATLANTIS - ULTIMA VIAGEM":"via Jd. Atlantis"},"ala":"3"},"250":{"var":{"Três Bandeiras":"","IV - CND":"via Curitibano IV e Jd. Canadá","Via CTO":"desce ao Centro","CTO-INSS-P.P.-I-II-CND-IV":"via Centro, INSS, Pq. Presidente I e II, Jd. Canadá e Curitibano IV","INSS - P.P II":"via INSS e Pq. Presidente II","INSS - PP1-2 - CND.IV":"via INSS, Pq. Presidente I e II, Jd. Canadá e Curitibano IV"},"ala":"3"},"310":{"var":{"LIBRA II":"","PRIMEIRA VIAJEM LIBRA II-CTO":"desce ao Centro","LIBRA II-CTO-TTU-REC":"desce ao Centro","LIBRA II-AV. JULES RIMET":"via Av. Jules Rimet"},"ala":"3"},"315":{"var":{"Primeiro de maio":"","VIA-LGTR":"via Lote Grande","PORTAL-CTO-T6":"desce ao Centro","PORTAL-CTO":"desce ao Centro","PORTAL-CTO-REC":"desce ao Centro"},"ala":"3"},"320":{"var":{"INTERBAIRROS -UNI":"","PRIMEIRA VIAJEM":"","TRES-UNI-VILA C":"","UNI-RENDIÇÃO PARTE(1)":"","UNI-RENDIÇÃO PARTE(2)":"","ULTIMA VIAJEM- UNI":"","INTERBAIRROS *":"sem passar na Unioeste","PRIM-VIJ *":"sem passar na Unioeste","INTEBAIRROS*-RENDIÇÃO PARTE(1)":"sem passar na Unioeste","INTERBAIRROS*- RENDIÇAO PARTE(2)":"sem passar na Unioeste","ULTIMA VIAJEM *":"sem passar na Unioeste","INTERBAIRROS - CAMPUS UNIOESTE":"entra no campus da Unioeste"}},"325":{"var":{"NAIPI":"via Jd. Naipi","NAIPI - VF":"via Jd. Naipi e Vila Florata","MARACANÃ - VF":"via Maracanã e Vila Florata","JD. Guarapuava":"via Maracanã"},"ala":"3"},"335":{"var":{"Morumbi-DI":"","Morumbi Até o centro":"vai até o Centro","Morumbi - Via Centro":"via Centro","Rodoviária":"sai da Rodoviária","Gaúcha":"sai da Av. JK (Loja Gaúcha)"},"ala":"3"},"345":{"var":{"TTU-UNIMED":"","VIA APARECIDINHA":"via Aparecidinha"},"ala":"2"},"350":{"var":{"Linha 350":"","Linha 0350 ( Rec)":"","DI":"direto","Linha 0350( Rec) Direto":"direto","DI-BARÃO":"direto · até o Colégio Barão","PONTE-BARÃO":"via Colégio Barão"}},"360":{"var":{"PORTAL":"","PORTAL-REC":""},"ala":"1"},"380":{"var":{"JD. São Roque":"","Via Av. das Cataratas":"via Av. das Cataratas"},"ala":"2"}}};</script>
<script>
(function(){
'use strict';
const $=q=>document.querySelector(q);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const TTU=[-25.5326,-54.5875], R_TERM=+(new URLSearchParams(location.search).get('raio_ttu'))||130; // "no terminal": a menos de R_TERM m do centro do TTU e parado ou devagar (quem passa pelas ruas em volta não conta)
const VEL_KMH=18; // velocidade média (km/h) para estimar a chegada ao Terminal pelo que falta do trajeto
const ESP_RE=/(^|[^A-Za-zÀ-ÿ])ESP([^A-Za-zÀ-ÿ]|$)/i;
const KX=111320*Math.cos(-25.52*Math.PI/180), KY=110540;
const dist=(a,b,c,d)=>Math.hypot((b-d)*KX,(a-c)*KY);
let D=null, LIN=[], RT={t:0,v:[]}, pagina=0;
// Onde a TV está: TTU (padrão) ou outro local, pelo endereço: ?local=aeroporto (pontos do mapa) ou ?lat=-25.44&lon=-54.58&nome=Unioeste
const LOCAIS={ttu:['Terminal de Transporte Urbano (TTU)',-25.5326,-54.5875],aeroporto:['Aeroporto Internacional (IGU)',-25.5963,-54.4872],cataratas:['Cataratas do Iguaçu (Parque Nacional)',-25.6143,-54.4813],
  aves:['Parque das Aves',-25.615,-54.4847],itaipu:['Itaipu Binacional (Centro de Visitantes)',-25.4475,-54.5857],marco:['Marco das Três Fronteiras',-25.592,-54.5916],rodoviaria:['Rodoviária Internacional',-25.5203,-54.5631]};
const QS=new URLSearchParams(location.search), LOC=(()=>{ const k=(QS.get('local')||'').toLowerCase(), la=parseFloat(QS.get('lat')), lo=parseFloat(QS.get('lon'));
  if(isFinite(la)&&isFinite(lo)) return {k:'livre',nome:QS.get('nome')||'Ponto de ônibus',lat:la,lon:lo,raio:+QS.get('raio')||400};
  const L=LOCAIS[k]||LOCAIS.ttu; return {k:LOCAIS[k]?k:'ttu',nome:QS.get('nome')||L[0],lat:L[1],lon:L[2],raio:+QS.get('raio')||400}; })();
const NO_TTU=LOC.k==='ttu';

// escala a tela de 1920×1080 para qualquer TV/monitor
function escala(){ const s=Math.min(innerWidth/1920,innerHeight/1080), t=$('#tela'); t.style.transform='scale('+s+')'; t.style.left=((innerWidth-1920*s)/2)+'px'; t.style.top=((innerHeight-1080*s)/2)+'px'; }
addEventListener('resize',escala); escala();
if(!NO_TTU){ $('#tela').classList.add('ponto'); $('#cab').innerHTML='<div>Linha</div><div>Sentido</div><div>Passa ≈</div><div>Situação</div><div>Depois</div>';
  document.querySelector('header h1').textContent='Próximos ônibus'; document.querySelector('header p').textContent=LOC.nome; document.title='Próximos ônibus – '+LOC.nome; }

// ── tipo de dia e hora "operacional" (viagens depois da meia-noite contam no dia anterior) ──
const isoDe=n=>n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
function diaOper(){ const n=new Date(); if(n.getHours()<3) n.setDate(n.getDate()-1); return n; }
function tipoDia(){ const n=diaOper(), iso=isoDe(n), e=(D.especiais||{})[iso]; if(e&&/^(DU|SAB|DOM)$/.test(e.tabela)) return e.tabela;
  const f=(D.feriados||{})[iso]; if(f==='DU'||f==='SAB'||f==='DOM') return f; const w=n.getDay(); return w===0?'DOM':w===6?'SAB':'DU'; }
function agora(){ const d=new Date(); const m=d.getHours()*60+d.getMinutes()+d.getSeconds()/60; return m<180?m+1440:m; }

// ── texto curto do trajeto (o mesmo das tabelas de horários: config + planilha) ──
const INTERNAS=['esp','prim','primeira','ultima','viagem','viajem','vij','v','rec','rc','recolhimento','soltura','rendicao','parte','5min','t10','t6','f','sabado'];
const semAc=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function cap(t){ const MIN=['o','a','os','as','e','de','da','do','das','dos','em','no','na','pela','pelo','ao']; let ini=true;
  return String(t||'').split(/(\s+)/).map(w=>{ if(!w.trim()) return w; if(w==='·'||w==='→'){ ini=true; return w; } let r=w;
    if(!/[A-ZÀ-Ý]/.test(w.slice(1))&&!(!ini&&MIN.indexOf(w.toLowerCase())>=0)) r=w.charAt(0).toUpperCase()+w.slice(1); ini=false; return r; }).join(''); }

function prepara(){
  const sobre=(D.siglas&&D.siglas.linhas)||{};
  Object.keys(sobre).forEach(id=>{ const a=CFG.linhas[id]||(CFG.linhas[id]={}), b=sobre[id]||{}; Object.keys(b).forEach(k=>{ if(k==='var') a.var=Object.assign({},a.var||{},b.var||{}); else a[k]=b[k]; }); });
  const junta={}; Object.keys(CFG.grupos||{}).forEach(g=>CFG.grupos[g].forEach(id=>{ if(id!==g) junta[id]=g; }));
  const SH=[0,-14,12,-24,20,-6,28], idx={}, FAM={f0:'#d8402f',f1:'#1c62b9',f2:'#2a8a4a',f3:'#7b3fa3'};
  const shade=(hex,p)=>{ const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; const f=v=>Math.max(0,Math.min(255,Math.round(p<0?v*(1+p/100):v+(255-v)*p/100))); return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join(''); };
  const por={};
  D.linhas.forEach(l=>{ const esc_=l.esc===true||l.esc==='True'; const n=parseInt(l.id,10), f=esc_?'fe':n<100?'f0':n<200?'f1':n<300?'f2':'f3'; idx[f]=idx[f]||0; l.cor=shade(FAM[f]||'#b07a12',SH[idx[f]%SH.length]); idx[f]++;
    if(esc_) return; const ttu=l.ttu===true||l.ttu==='True'; if(!ttu) return;
    const g=junta[l.id]||l.id, o=por[g]||(por[g]={id:g,ids:[],nome:'',cor:l.cor,cfg:CFG.linhas[g]||{},t:{},b:{}});
    o.ids.push(l.id); if(g===l.id){ o.nome=o.cfg.nome||l.nome; o.cor=l.cor; }
    // tempo do início do trajeto até o Terminal (linhas que saem do Centro, como a 10, passam no TTU alguns minutos depois)
    l.shapes.forEach(s=>{ if(s._off!=null) return; const p=s.p||[]; let tot=0, ate=0, best=1e9, acc=0;
      for(let i=1;i<p.length;i++) tot+=dist(p[i-1][0],p[i-1][1],p[i][0],p[i][1]);
      for(let i=0;i<p.length;i++){ if(i) acc+=dist(p[i-1][0],p[i-1][1],p[i][0],p[i][1]); const d=dist(p[i][0],p[i][1],TTU[0],TTU[1]); if(d<best){ best=d; ate=acc; } }
      s._near=best; s._off=best<180&&tot>0?Math.round((ate/tot)*(s.d||0)):null; });
    Object.keys(l.dep||{}).forEach(dk=>{ ['T','B'].forEach(sx=>{ (l.dep[dk][sx]||[]).forEach(x=>{ const sh=l.shapes[x[1]]; if(!sh||ESP_RE.test(sh.v||'')) return; const m=x[0]<180?x[0]+1440:x[0];
      if(sx==='B'){ (o.b[dk]=o.b[dk]||{})[m%1440]=sh; return; } // viagens de volta ao Terminal: minuto de saída → trajeto
      if(sh._off==null) return; // trajeto que não passa no Terminal
      const vs=(o.cfg.var||{}), rot=Object.prototype.hasOwnProperty.call(vs,sh.v)?vs[sh.v]:'';
      (o.t[dk]=o.t[dk]||[]).push({m:m+sh._off, ini:m, r:rot, l:l.id}); }); }); }); });
  LIN=Object.values(por).filter(o=>Object.keys(o.t).length); LIN.forEach(o=>{ Object.values(o.t).forEach(a=>a.sort((p,q)=>p.m-q.m)); o.ala=o.cfg.ala||''; o.dest=o.cfg.dest||o.nome; });
  if(!NO_TTU) preparaPonto();
}

// ── outro local: viagens dos dois sentidos que passam a menos de LOC.raio do ponto, com o horário estimado de passagem ──
const tira=t=>String(t||'').replace(/^saindo d[oa]s?\s+/i,'').trim();
function cumula(sh){ const p=sh.p||[]; if(!sh._cum){ sh._cum=[0]; for(let i=1;i<p.length;i++) sh._cum.push(sh._cum[i-1]+dist(p[i-1][0],p[i-1][1],p[i][0],p[i][1])); } return sh._cum; }
function noPonto(sh){ if(sh._lp!==undefined) return sh._lp; const p=sh.p||[]; let b=-1,bd=1e9; p.forEach((q,i)=>{ const d=dist(q[0],q[1],LOC.lat,LOC.lon); if(d<bd){ bd=d; b=i; } });
  const c=cumula(sh), tot=c[c.length-1]||0; if(bd>LOC.raio||!tot){ sh._lp=null; return null; } const fr=c[b]/tot; if(fr>0.96){ sh._lp=null; return null; } // termina aqui: não "passa"
  sh._lp={i:b,off:Math.round(fr*(sh.d||0))}; return sh._lp; }
function preparaPonto(){
  const junta={}; Object.keys(CFG.grupos||{}).forEach(g=>CFG.grupos[g].forEach(id=>{ if(id!==g) junta[id]=g; }));
  const por={};
  D.linhas.forEach(l=>{ if(l.esc===true||l.esc==='True') return; const g=junta[l.id]||l.id, cfg=CFG.linhas[g]||{}, ttu=l.ttu===true||l.ttu==='True', nome=cfg.nome||l.nome;
    Object.keys(l.dep||{}).forEach(dk=>{ ['T','B'].forEach(sx=>{ (l.dep[dk][sx]||[]).forEach(x=>{ const sh=l.shapes[x[1]]; if(!sh||ESP_RE.test(sh.v||'')) return; const lp=noPonto(sh); if(!lp) return;
      const m=x[0]<180?x[0]+1440:x[0], k=g+'|'+sx;
      const o=por[k]||(por[k]={id:g,s:sx,ids:[],nome,cor:l.cor,cfg,t:{},ala:'',
        dest:sx==='T'?'Sentido '+(tira(cfg.B)||nome):(ttu?'Sentido Centro (Terminal TTU)':'Sentido '+(tira(cfg.T)||'volta'))});
      if(o.ids.indexOf(l.id)<0) o.ids.push(l.id);
      const vs=cfg.var||{}, rot=Object.prototype.hasOwnProperty.call(vs,sh.v)?vs[sh.v]:'';
      (o.t[dk]=o.t[dk]||[]).push({m:m+lp.off,ini:m,r:rot,l:l.id,sh,lp}); }); }); }); });
  LIN=Object.values(por); LIN.forEach(o=>Object.values(o.t).forEach(a=>a.sort((p,q)=>p.m-q.m)));
}
// situação no ponto: o ônibus de cada viagem é achado pelo minuto de saída que o ITS informa; o que falta é medido pelo trajeto
// memória da última posição de cada viagem: quando o ônibus some do GPS por alguns minutos, a previsão continua
// a partir do último sinal (descontando o tempo que passou) em vez de pular entre "Chegando", "Atrasado" e o horário programado
const MEM={}, MEM_MAX=15; // minutos que a última posição continua valendo
function situacaoPonto(o,dk){ const ag=agora(), a=o.t[dk]||[], agMs=Date.now(); if(!a.length) return null;
  const bus={}; RT.v.forEach(x=>{ if(o.ids.indexOf(String(x[3]))<0||x[5]==null) return; const sx=x[4]==='0'?'T':x[4]==='1'?'B':null; if(sx&&sx!==o.s) return; bus[String(x[3])+'|'+(x[5]%1440)]=x; });
  const out=[];
  for(const v of a){ if(out.length>=10) break; const k=dk+'|'+v.l+'|'+v.ini, x=bus[v.l+'|'+(v.ini%1440)], f=Math.round(v.m-ag);
    let eta=null, velho=0, mem=MEM[k];
    if(mem&&mem.passou) continue;
    if(x){ const p=v.sh.p, c=cumula(v.sh); let b=-1,bd=1e9; p.forEach((q,i)=>{ const d=dist(q[0],q[1],x[1],x[2]); if(d<bd){ bd=d; b=i; } });
      if(dist(x[1],x[2],LOC.lat,LOC.lon)<120&&x[6]<120){ MEM[k]={eta:0,t:agMs,st:'term'}; out.push({x:v,c:'term',t:'No ponto',sub:'embarque agora',e:ag}); continue; }
      if(bd<500){ const r=c[v.lp.i]-c[b];
        if(r<-150){ MEM[k]={passou:1,t:agMs}; continue; } // já passou por aqui
        const e0=Math.max(0,r/1000/VEL_KMH*60-(x[6]||0)/60); // desconta a idade da posição
        mem=MEM[k]={eta:e0,t:agMs,st:mem&&mem.st}; eta=e0; } }
    if(eta==null&&mem&&!mem.passou&&(agMs-mem.t)<MEM_MAX*60000){ velho=Math.round((agMs-mem.t)/60000); eta=Math.max(0,mem.eta-velho); }
    if(eta!=null){ const etaR=Math.max(1,Math.round(eta)), nota=velho>=1?' · último sinal há '+velho+' min':'';
      // "Atrasado" só entra com folga de 6 min e só sai com folga de 3 (não fica piscando entre os dois)
      const atr=mem&&mem.st==='atr'?eta>f+3:eta>f+6;
      if(etaR<=5){ mem.st='cheg'; out.push({x:v,c:'cheg',t:'Chegando',sub:'≈ '+etaR+' min'+(f<-2?' · atrasado '+(-f)+' min':'')+nota,e:ag+eta}); continue; }
      if(atr){ mem.st='atr'; out.push({x:v,c:'atr',t:'Atrasado',sub:'previsto ≈ '+hm(Math.round(ag+eta))+nota,e:ag+eta}); continue; }
      mem.st='prog'; out.push({x:v,c:'prog',t:f<60?'Em '+f+' min':'Programado',sub:'ônibus a caminho'+nota}); continue; }
    if(v.m+2<=ag) continue;
    // viagem que já saiu do ponto inicial e cujo ônibus não aparece no GPS: avisa que está sem sinal
    if(RT.t&&v.ini<=ag){ out.push({x:v,c:'off',t:f<=0?'Agora':'Em '+f+' min',sub:'ônibus sem sinal de GPS'}); continue; }
    out.push({x:v,c:f<=0?'saindo':'prog',t:f<=0?'Agora':f<60?'Em '+f+' min':'Programado',sub:RT.t?(f<60?'horário estimado':''):'GPS indisponível no momento'}); }
  Object.keys(MEM).forEach(k=>{ if(agMs-MEM[k].t>90*60000) delete MEM[k]; });
  // ordem pelo horário em que o ônibus deve passar de fato: um atrasado que só chega depois do seguinte vai para trás dele
  out.forEach(z=>{ if(z.e==null) z.e=z.x.m; }); out.sort((p,q)=>p.e-q.e);
  return out.length?out:null; }

// ── situação de cada linha: ônibus no Terminal, a caminho (viagem de volta ao Terminal) ou só o horário programado ──
// quanto falta, pelo trajeto, do ponto onde o ônibus está até o fim (o Terminal); null se ele estiver fora do trajeto
function falta(sh,lat,lon){ const p=sh.p||[]; if(p.length<2) return null;
  if(!sh._cum){ sh._cum=[0]; for(let i=1;i<p.length;i++) sh._cum.push(sh._cum[i-1]+dist(p[i-1][0],p[i-1][1],p[i][0],p[i][1])); }
  let b=-1, bd=1e9; for(let i=0;i<p.length;i++){ const d=dist(lat,lon,p[i][0],p[i][1]); if(d<bd){ bd=d; b=i; } }
  if(bd>500) return null; return sh._cum[p.length-1]-sh._cum[b]; }
// situação de cada linha:
//  • "No terminal": ônibus da linha parado na área do TTU (menos os que já saíram numa viagem de ida);
//  • "Chegando": ônibus numa viagem de VOLTA ao Terminal (sentido 1 do ITS) a no máximo 5 min, pelo trajeto;
//  • "Atrasado": o ônibus que vai fazer a partida ainda está longe e só chega bem depois do horário;
//  • senão, o horário programado.
function situacao(o,dk){ const ag=agora(), a=(o.t[dk]||[]), prox=a.filter(x=>x.m+2>ag); if(!prox.length) return null;
  const agM=Math.floor(ag)%1440, noTerm=[], vindo=[], bv=o.b[dk]||{};
  RT.v.filter(x=>o.ids.indexOf(String(x[3]))>=0&&x[6]<240).forEach(x=>{ const d=dist(x[1],x[2],TTU[0],TTU[1]), mi=x[5]==null?null:x[5]%1440;
    const ida=x[4]==='0'||(x[4]!=='1'&&mi!=null&&!bv[mi]); // sentido 0 = saindo do Terminal
    if(d<R_TERM&&!(x[7]>8)){ if(ida&&mi!=null&&((agM-mi+1440)%1440)<180&&((agM-mi+1440)%1440)>=1) return; delete MEM['T|'+x[3]+'|'+mi]; noTerm.push(x); return; } // já saiu na viagem de ida
    if(ida) return;
    const sh=mi!=null?bv[mi]:null, r=sh?falta(sh,x[1],x[2]):null, m=r!=null?r:d*1.35, eta=Math.max(0,m/1000/VEL_KMH*60-(x[6]||0)/60), k='T|'+x[3]+'|'+mi;
    MEM[k]={eta,t:Date.now(),st:(MEM[k]||{}).st}; vindo.push({x,k,eta:Math.max(1,Math.round(eta))}); });
  // ônibus que sumiu do GPS há pouco: continua "vindo" pela última posição, descontando o tempo que passou
  Object.keys(MEM).forEach(k=>{ const p=k.split('|'); if(p[0]!=='T'||o.ids.indexOf(p[1])<0||vindo.some(z=>z.k===k)) return; const m=MEM[k], v=(Date.now()-m.t)/60000;
    if(v<MEM_MAX&&m.eta-v>-2) vindo.push({k,eta:Math.max(1,Math.round(m.eta-v)),velho:Math.round(v)}); });
  vindo.sort((p,q)=>p.eta-q.eta);
  const s=prox.slice(0,4).map((x,i)=>{ const f=Math.round(x.m-ag);
    if(i<noTerm.length) return {x,c:f<=0?'saindo':'term',t:f<=0?'Saindo':'No terminal',sub:f>0?'embarque na plataforma':''};
    const v=vindo[i-noTerm.length];
    const nota=v&&v.velho>=1?' · último sinal há '+v.velho+' min':'', mm=v?MEM[v.k]:null;
    if(v&&v.eta<=5){ if(mm) mm.st='cheg'; return {x,c:'cheg',t:'Chegando',sub:'≈ '+v.eta+' min para o Terminal'+nota}; }
    if(v&&(mm&&mm.st==='atr'?v.eta>f+3:v.eta>f+6)){ if(mm) mm.st='atr'; return {x,c:'atr',t:'Atrasado',sub:'saída prevista ≈ '+hm(Math.round(ag+v.eta+1))+nota}; }
    if(mm) mm.st='prog';
    if(f<=0) return {x,c:'saindo',t:'Agora',sub:'horário programado'};
    return {x,c:'prog',t:f<60?'Em '+f+' min':'Programado',sub:v?'ônibus a caminho do Terminal':(RT.t?'':'sem GPS no momento')}; });
  return s; }

function desenha(){ if(!D) return; const dk=tipoDia(), ag=agora();
  const rows=LIN.map(o=>({o,s:NO_TTU?situacao(o,dk):situacaoPonto(o,dk)})).sort((p,q)=>(p.s?(p.s[0].e||p.s[0].x.m):1e9)-(q.s?(q.s[0].e||q.s[0].x.m):1e9)||parseInt(p.o.id,10)-parseInt(q.o.id,10));
  let ativos=rows.filter(r=>r.s);
  // poucas linhas passando aqui (aeroporto, cataratas…): cada viagem ganha a sua linha na tela, com a situação dela
  const umaPorViagem=!NO_TTU&&ativos.length&&ativos.length<=4;
  if(umaPorViagem) ativos=[].concat(...ativos.map(r=>r.s.map((z,k)=>({o:r.o,s:[z],via:true})))).sort((p,q)=>(p.s[0].e||p.s[0].x.m)-(q.s[0].e||q.s[0].x.m)).slice(0,12);
  if(!NO_TTU){ const ul=$('#cab').lastElementChild; if(ul) ul.textContent=umaPorViagem?'Viagem':'Depois'; }
  const porPag=12, pags=Math.max(1,Math.ceil(ativos.length/porPag)); if(pagina>=pags) pagina=0;
  const vis=ativos.slice(pagina*porPag,(pagina+1)*porPag), h=Math.floor((1080-118-64-70)/porPag);
  $('#lista').innerHTML=vis.map(r=>{ const o=r.o, s0=r.s[0], depois=r.via?'início '+hm(s0.x.ini):r.s.slice(1,3).map(z=>hm(Math.round(z.x.m))).join(' · ');
    const rot=s0.x.r?cap(s0.x.r):'';
    return '<div class="row" style="--h:'+h+'px"><div class="num" style="background:'+o.cor+';color:#fff'+(o.ids.join('/').length>4?';font-size:32px':'')+'">'+esc(o.ids.join('/'))+'</div>'+
      '<div class="dest"><b>'+esc(o.dest)+'</b>'+(rot?'<span>'+esc(rot)+'</span>':'')+'</div>'+
      (NO_TTU?'<div class="ala">'+(o.ala?esc(o.ala)+'<small>ala</small>':'—')+'</div>':'')+
      '<div class="hr">'+hm(Math.round(s0.x.m))+'</div>'+
      '<div class="sit '+s0.c+'"><i></i><div>'+esc(s0.t)+(s0.sub?'<small>'+esc(s0.sub)+'</small>':'')+'</div></div>'+
      '<div class="dep">'+esc(depois)+'</div></div>'; }).join('')+(pags>1?'<div class="pag">página '+(pagina+1)+' de '+pags+'</div>':'')+
      (!ativos.length?'<div class="row" style="--h:120px"><div></div><div class="dest"><b>'+(NO_TTU?'Sem mais partidas hoje':'Sem mais ônibus hoje neste ponto')+'</b></div></div>':'');
}
function relogio(){ const n=new Date(); $('#hora').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  $('#data').textContent=n.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}); }
function avisos(){ const ag=Date.now(), l=(D.avisosLista||[]).filter(a=>a&&a.msg&&(!a.ini||ag>=a.ini)&&(!a.fim||ag<=a.fim)).map(a=>a.msg);
  const iso=isoDe(diaOper()), e=(D.especiais||{})[iso]; if(e) l.unshift(e.aviso||('Hoje'+(e.nome?' ('+e.nome+')':'')+': horários de '+({DU:'dia útil',SAB:'sábado',DOM:'domingo'}[e.tabela]||e.tabela)+'.'));
  l.push(NO_TTU?'Horários programados pela FOZTRANS. "Chegando" e "No terminal" vêm do GPS dos ônibus.':'Horários de passagem estimados pela FOZTRANS. "Chegando" e "No ponto" vêm do GPS dos ônibus.');
  const sp=$('#avisos'); sp.textContent=l.join('     •     '); sp.parentNode.style.setProperty('--t',Math.max(25,Math.round(sp.textContent.length/9))+'s'); }

// ── dados: horários (Apps Script) e posição dos ônibus (Cloudflare) ──
function baixaDados(){ const u=window.__DADOS_URL__; if(!/^https:\/\//.test(u)) return Promise.reject();
  return fetch(u,{cache:'no-store'}).then(r=>r.json()).then(d=>{ if(!d||!d.linhas) throw 0; D=d; prepara(); avisos(); desenha(); try{ localStorage.setItem('painel_dados',JSON.stringify(d)); }catch(e){} }); }
function baixaRT(){ const u=window.__RT_URL__; if(!/^https:\/\//.test(u)||!LIN.length) return;
  const ids=[].concat(...LIN.map(o=>o.ids)), lotes=[]; for(let i=0;i<ids.length;i+=12) lotes.push(ids.slice(i,i+12));
  Promise.all(lotes.map(l=>fetch(u.replace(/\/?$/,'/')+'?onibus=1&linha='+encodeURIComponent(l.join(',')),{cache:'no-store'}).then(r=>r.json()).catch(()=>null)))
    .then(rs=>{ const ok=rs.filter(r=>r&&r.t); RT={t:ok.length?Math.max(...ok.map(r=>r.t)):0,v:[].concat(...ok.map(r=>r.v||[]))}; desenha(); }); }
try{ const c=localStorage.getItem('painel_dados'); if(c){ D=JSON.parse(c); prepara(); avisos(); } }catch(e){}
relogio(); desenha();
baixaDados().catch(()=>{}).then(baixaRT);
setInterval(relogio,1000);
setInterval(baixaRT,20000);
setInterval(()=>{ pagina++; desenha(); },15000);
setInterval(()=>baixaDados().catch(()=>{}),30*60000);
setTimeout(()=>location.reload(),6*3600000); // recarrega a cada 6 h (evita a TV ficar com a página "cansada")
})();
</script>
